name: taskcaster_app
description: A cross-platform party game app for TaskCaster-style challenges

publish_to: 'none'

version: 1.2.11+16

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Firebase - Temporarily use updated versions to fix compilation
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1

  # Social sign-in.
  # google_sign_in 6.2.x is the line that pairs with firebase_auth ^5.3.3 —
  # it exposes GoogleSignInAuthentication (accessToken + idToken) which feeds
  # GoogleAuthProvider.credential(...). (7.x rewrote the API and is NOT used.)
  google_sign_in: ^6.2.1
  # Apple sign-in. On Android this runs Apple's web OAuth flow via
  # WebAuthenticationOptions (Services ID + redirect URI) — see
  # FirebaseAuthDataSource.signInWithApple.
  sign_in_with_apple: ^6.1.0
  # SHA-256 of the Apple sign-in nonce (Firebase requires a hashed nonce).
  crypto: ^3.0.3

  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^5.1.0
  shimmer: ^3.0.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.18.1
  collection: ^1.17.2
  get_it: ^7.6.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.1
  
  # Location Services
  # Bumped 10.1.0 -> 12.0.0 to satisfy ar_flutter_plugin_2 (requires
  # geolocator ^12.0.0). Only use is Geolocator.distanceBetween (stable API).
  geolocator: ^12.0.0
  permission_handler: ^11.0.1

  # Offline / no-internet local multiplayer for Drawing Telephone.
  # Google Nearby Connections (Bluetooth + Wi-Fi Direct). Android only — the
  # plugin is a no-op shim on web/iOS, so offline play is gated to Android.
  nearby_connections: ^4.3.0

  # Monetization (commented out for initial testing)
  # google_mobile_ads: ^4.0.0
  # in_app_purchase: ^3.1.11
  
  # AR Support — Balloon Pop AR task. Only ar_flutter_engine.dart imports this.
  ar_flutter_plugin_2: ^0.0.3
  
  # AI Integration
  http: ^1.1.0
  
  # Additional Utils
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  path_provider: ^2.1.1
  qr_flutter: ^4.1.0
  firebase_messaging: ^15.2.10
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  bloc_test: ^9.1.4
  mocktail: ^1.0.0
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  flutter_launcher_icons: ^0.13.1

# App launcher icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "#4A148C"
  min_sdk_android: 28

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/ar/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf